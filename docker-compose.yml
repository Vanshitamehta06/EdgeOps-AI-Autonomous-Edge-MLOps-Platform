services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata

  frontend:
    build:
      context: ./edgeops-dashboard
      dockerfile: dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./edgeops-dashboard:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000 
    depends_on:
      - backend

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - TZ=Asia/Kolkata
    volumes:
      - grafana-storage:/var/lib/grafana
      - .:/app_data

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:////app_data/mlflow.db --default-artifact-root /app_data/mlruns --host 0.0.0.0 --port 5000
    volumes:
      - .:/app_data

  plc-emulator:
    build:
      context: .
      dockerfile: dockerfile
    container_name: plc_emulator
    command: python industrial/opc_ua_plc_server.py --endpoint opc.tcp://0.0.0.0:4840/edgeops/simulated_s7_plc/
    ports:
      - "4840:4840"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - plc

volumes:
  grafana-storage:
