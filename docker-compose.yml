services:
  backend:
    build:
      context: .
      dockerfile: dockerfile  # Matches your exact lowercase spelling
    ports:
      - "8000:8000"
    volumes:
      # CHANGE: Instead of mounting 8 individual files/folders, mount the project root directory.
      # This allows SQLite to generate and share the .db, .db-wal, and .db-shm files seamlessly!
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata

  frontend:
    build:
      context: ./edgeops-dashboard  # Matches your exact folder name
      dockerfile: dockerfile
    ports:
      - "5173:5173"  # Standard Vite port
    environment:
      - VITE_API_URL=http://localhost:8000 
    depends_on:
      - backend

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - TZ=Asia/Kolkata
    volumes:
      - grafana-storage:/var/lib/grafana
      # CHANGE: Mount the host root directory into /app_data so Grafana can read the DB folder perfectly
      - .:/app_data

volumes:
   grafana-storage: